# Test profile configuration
spring.application.name=raas-test

# Google AI Studio Gemini API key placeholder for tests
spring.ai.google.genai.api-key=test-key

# MCP Server Configuration for tests
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=raas-mcp-server-test
spring.ai.mcp.server.version=0.0.1-test
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=streamable

# YouTube Configuration for tests
raas.youtube.api-key=test-youtube-api-key-1234567890
raas.youtube.channel-id=UC1234567890123456789012
raas.youtube.application-name=raas-youtube-test

# Blog Configuration for tests
raas.blog.rss-url=https://robsoncassiano.com/rss.xml
raas.blog.cache-duration=PT30M

# Speaking Configuration for tests
raas.speaking.api-url=https://robsoncassiano.com/api/speaking
raas.speaking.cache-duration=PT30M

# Newsletter Configuration for tests
raas.newsletter.api-key=test-newsletter-api-key
raas.newsletter.base-url=https://api.beehiiv.com/v2
raas.newsletter.cache-duration=PT30M
raas.newsletter.publications.robsoncassiano=pub_test_robson_123
raas.newsletter.publications.bytesizedai=pub_test_bytesizedai_456

# Podcast Configuration for tests
raas.podcast.cache-duration=PT30M
raas.podcast.playlist-ids.robsoncassiano=PL12345678901234567890123456789012
raas.podcast.playlist-ids.bytesizedai=PL09876543210987654321098765432109