# Integration test configuration
spring.application.name=raas-integration-test

# Google AI Studio Gemini API key placeholder for integration tests
spring.ai.google.genai.api-key=test-key

# MCP Server Configuration for integration tests
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=raas-mcp-server-integration
spring.ai.mcp.server.version=0.0.1-raas-integration
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=streamable

# YouTube Configuration
raas.youtube.api-key=${YOUTUBE_API_KEY:test-youtube-api-key-1234567890}
raas.youtube.channel-id=${YOUTUBE_CHANNEL_ID:UC1234567890123456789012}
raas.youtube.application-name=raas-youtube-test

# Blog Configuration
raas.blog.rss-url=https://robsoncassiano.com/rss.xml
raas.blog.cache-duration=PT30M

# Speaking Configuration
raas.speaking.api-url=https://robsoncassiano.com/api/speaking
raas.speaking.cache-duration=PT30M

# Newsletter Configuration (Beehiiv)
raas.newsletter.api-key=test-newsletter-api-key
raas.newsletter.base-url=https://api.beehiiv.com/v2
raas.newsletter.cache-duration=PT30M
raas.newsletter.publications.robsoncassiano=pub_test_robson_123
raas.newsletter.publications.bytesizedai=pub_test_bytesizedai_456

# Podcast Configuration (Transistor)
raas.podcast.api-key=test-podcast-api-key-1234567890
raas.podcast.application-name=raas-podcast-mcp-test
raas.podcast.cache-duration=PT30M
raas.podcast.spring-office-hours-show-id=41020
raas.podcast.fundamentals-show-id=69333

# Logging
logging.level.software.robsoncassiano.raas.tools.youtube=DEBUG