spring.application.name=raas
spring.profiles.active=http

# AI (Google AI Studio Gemini)
spring.ai.google.genai.api-key=${GOOGLE_AI_API_KEY:test-google-ai-key}

# MCP Config
spring.ai.mcp.server.name=raas-mcp-server
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.type=SYNC

# YouTube Configuration
raas.youtube.api-key=${YOUTUBE_API_KEY:test-youtube-key}
raas.youtube.channel-id=${YOUTUBE_CHANNEL_ID:UC_PLACEHOLDER_1234567890}
raas.youtube.application-name=raas-youtube-mcp

# Blog Configuration
raas.blog.rss-url=${BLOG_RSS_URL:}
raas.blog.cache-duration=PT30M

# Speaking Configuration
raas.speaking.api-url=${SPEAKING_API_URL:https://robsoncassiano.com/api/speaking}
raas.speaking.cache-duration=PT30M

# Newsletter Configuration
raas.newsletter.api-key=${BEEHIIV_API_KEY:test-api-key}
raas.newsletter.base-url=https://api.beehiiv.com/v2
raas.newsletter.cache-duration=PT30M
raas.newsletter.publications.robsoncassiano=${BEEHIIV_PUBLICATION_ID:pub_placeholder}

# Podcast Configuration (YouTube-based)
raas.podcast.cache-duration=PT30M
raas.podcast.playlist-ids.robsoncassiano=${YOUTUBE_PODCAST_PLAYLIST_ID:PL_PLACEHOLDER}
