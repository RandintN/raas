spring.application.name=raas
spring.profiles.active=http

# AI
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}

# MCP Config
spring.ai.mcp.server.name=raas-mcp-server
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.type=SYNC

# YouTube Configuration
raas.youtube.api-key=${YOUTUBE_API_KEY:}
raas.youtube.channel-id=${YOUTUBE_CHANNEL_ID:}
raas.youtube.application-name=raas-youtube-mcp

# Blog Configuration
raas.blog.rss-url=${BLOG_RSS_URL:}
raas.blog.cache-duration=PT30M

# Speaking Configuration
raas.speaking.api-url=${SPEAKING_API_URL:}
raas.speaking.cache-duration=PT30M

# Newsletter Configuration
raas.newsletter.api-key=${BEEHIIV_API_KEY:}
raas.newsletter.base-url=https://api.beehiiv.com/v2
raas.newsletter.cache-duration=PT30M
raas.newsletter.publication-id=${BEEHIIV_PUBLICATION_ID:}

# Podcast Configuration
raas.podcast.api-key=${TRANSISTOR_API_KEY:}
raas.podcast.application-name=raas-podcast-mcp
raas.podcast.cache-duration=PT30M
raas.podcast.show-id=${TRANSISTOR_SHOW_ID:}
